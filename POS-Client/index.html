<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHERBI POS - إعداد الكاشير</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #020617; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background-color: #0f172a; padding: 40px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
    .logo { width: 80px; height: 80px; margin-bottom: 20px; }
    h2 { color: #f8fafc; margin-top: 0; font-size: 24px; font-weight: 900; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
    input { width: 100%; padding: 16px; margin-bottom: 20px; box-sizing: border-box; background-color: #020617; border: 2px solid #1e293b; color: white; border-radius: 12px; text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 2px; direction: ltr; transition: 0.3s; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    button { width: 100%; padding: 16px; background-color: #2563eb; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
    button:hover { background-color: #1d4ed8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <h2>إعداد جهاز الكاشير</h2>
    <p>أهلاً بك في نظام <b>GHERBI.AI POS</b>.<br>للربط بقاعدة البيانات، يرجى إدخال عنوان الـ IP الخاص بالحاسوب الرئيسي (السيرفر) أدناه.</p>
    
    <input type="text" id="ipInput" placeholder="مثلاً: 192.168.1.100" autocomplete="off">
    <button onclick="saveIp()">الاتصال وحفظ الإعدادات</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    function saveIp() {
      const ip = document.getElementById('ipInput').value.trim();
      if(ip) {
        ipcRenderer.send('save-server-ip', ip);
      } else {
        alert("الرجاء إدخال رقم الـ IP أولاً!");
      }
    }

    // إمكانية الضغط على Enter للاتصال
    document.getElementById('ipInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') saveIp();
    });
  </script>
</body>
</html>
