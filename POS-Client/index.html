<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Client - الاتصال بالسيرفر</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a; /* لون داكن يتناسب مع تصميمك */
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    input {
      padding: 12px;
      font-size: 18px;
      margin: 20px 0;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #3b82f6;
      background: #0f172a;
      color: white;
      outline: none;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>نظام الكاشير (النسخة الطرفية)</h2>
    <p>يرجى إدخال عنوان الـ IP الخاص بالحاسوب الرئيسي:</p>
    
    <input type="text" id="ipInput" placeholder="مثال: 192.168.1.5" />
    <button onclick="connectToServer()">اتصال بالنظام</button>
  </div>

  <script>
    // 1. استرجاع الـ IP إذا كان محفوظاً من قبل
    const savedIP = localStorage.getItem('serverIP');
    if (savedIP) {
      document.getElementById('ipInput').value = savedIP;
    }

    // 2. دالة الاتصال
    function connectToServer() {
      const ip = document.getElementById('ipInput').value;
      if (ip) {
        // حفظ الـ IP للمرات القادمة
        localStorage.setItem('serverIP', ip);
        
        // استبدل 5000 برقم الـ PORT الخاص بالـ Express في الباك اند عندك
        const port = 3000; 
        
        // التوجه فوراً إلى شاشة البرنامج الرئيسي عبر الشبكة!
        window.location.href = `http://${ip}:${port}`;
      }
    }
  </script>
</body>
</html>
