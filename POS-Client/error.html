<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فقدان الاتصال</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #020617; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .container { max-width: 500px; padding: 40px; background-color: #0f172a; border-radius: 16px; border: 1px solid #334155; }
    .icon { font-size: 60px; margin-bottom: 20px; }
    h1 { color: #ef4444; font-size: 28px; margin-top: 0; }
    p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
    .buttons { display: flex; gap: 15px; justify-content: center; }
    button { padding: 14px 24px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; flex: 1; }
    .btn-retry { background-color: #2563eb; color: white; }
    .btn-retry:hover { background-color: #1d4ed8; }
    .btn-reset { background-color: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-reset:hover { background-color: #1e293b; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔌</div>
    <h1>تعذر الاتصال بالسيرفر!</h1>
    <p>يبدو أن حاسوب السيرفر (المدير) مغلق، أو أن هناك مشكلة في شبكة الـ Wi-Fi. يرجى التأكد من تشغيل السيرفر والمحاولة مجدداً.</p>
    
    <div class="buttons">
      <button class="btn-retry" onclick="location.reload()">إعادة المحاولة</button>
      <button class="btn-reset" onclick="resetIp()">تغيير رقم الـ IP</button>
    </div>
  </div>
  
  <script>
    const { ipcRenderer } = require('electron');
    function resetIp() {
      // إرسال طلب لـ main.js لحذف الـ IP القديم والعودة لصفحة السؤال
      ipcRenderer.send('reset-server-ip');
    }
  </script>
</body>
</html>
